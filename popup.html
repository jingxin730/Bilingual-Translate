<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual Translate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">

    <div class="header">
      <div class="logo">
        <img src="icons/icon48.png" class="logo-icon-img" alt="">
        <span class="logo-name" data-i18n="appName"></span>
      </div>
      <div class="version">v1.0</div>
    </div>

    <div class="lang-row">
      <div class="lang-badge" data-i18n="autoDetect"></div>
      <span class="lang-arrow">→</span>
      <select id="targetLang" class="lang-select">
        <option value="zh">简体中文</option>
        <option value="zh-TW">繁体中文</option>
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="setting-row">
      <span class="setting-label" data-i18n="translationService"></span>
      <select id="providerSelect" class="setting-select"></select>
    </div>

    <button id="translateBtn" class="translate-btn">
      <span id="btnLabel" data-i18n="translate"></span>
      <kbd class="shortcut">⌥A</kbd>
    </button>

    <div id="progressWrap" class="progress-wrap hidden">
      <div id="progressBar" class="progress-bar"></div>
      <span id="progressText" class="progress-text">0 / 0</span>
    </div>

    <div id="statusMsg" class="status-msg hidden"></div>

    <div class="quick-section">
      <span class="quick-label" data-i18n="quickActions"></span>
      <div class="quick-btns">
        <button class="quick-btn" id="toggleBtn">
          <span class="qicon">👁</span>
          <span id="toggleLabel" data-i18n="hideTranslation"></span>
        </button>
        <button class="quick-btn" id="clearBtn">
          <span class="qicon">✕</span>
          <span data-i18n="clearTranslation"></span>
        </button>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
